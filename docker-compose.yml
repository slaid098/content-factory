services:
  api:
    build: .
    # Внутри контейнера слушаем все интерфейсы, но наружу порт публикуется
    # только на loopback хоста. По умолчанию образ слушает 127.0.0.1.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CONTENT_FACTORY_DATA_DIR: /app/app_data
    volumes:
      - ./app_data:/app/app_data
    restart: unless-stopped

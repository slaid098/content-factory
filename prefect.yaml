name: content-factory

build: null
push: null

# Воркер process-пула запускает flow из своего контейнера, где код лежит
# в /app. Явный шаг убирает интерактивный вопрос при `prefect deploy`.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: stock_topup
    description: "Плановый добор стока по языкам"
    entrypoint: src/content_factory/flows/stock_topup/flow.py:stock_topup
    work_pool:
      name: content-factory
    # Тик планировщика каждые 15 минут. Производство запускает сам flow,
    # если истёк config.run.interval; холостые тики выходят сразу.
    schedules:
      - slug: every-15-minutes
        cron: "*/15 * * * *"
        timezone: UTC
        active: true
    concurrency_limit: 1

  - name: titles
    description: "Генерация уникальных названий по кадрам видео"
    entrypoint: src/content_factory/flows/titles/flow.py:titles
    work_pool:
      name: content-factory
    # Отдельный тик каждые 10 минут: названия нужны раньше, чем следующий
    # добор стока, и не должны ждать долгого stock_topup.
    schedules:
      - slug: every-10-minutes
        cron: "*/10 * * * *"
        timezone: UTC
        active: true
    concurrency_limit: 1

  - name: profile_refill
    description: "Плановый добор включённых профилей генератора"
    entrypoint: src/content_factory/flows/profile_refill/flow.py:profile_refill
    work_pool:
      name: content-factory
    # Тик каждые 15 минут. По умолчанию все профили выключены, поэтому тик
    # выходит сразу; включённый профиль запускает generate_batch отдельным
    # flow run и не ждёт его конца.
    schedules:
      - slug: every-15-minutes
        cron: "*/15 * * * *"
        timezone: UTC
        active: true
    concurrency_limit: 1

  - name: generate_batch
    description: "Ручной батч дейтинг-роликов: Vast.ai + ComfyUI, без расписания"
    entrypoint: src/content_factory/flows/generate_batch/flow.py:generate_batch
    work_pool:
      name: content-factory
    concurrency_limit: 1

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-factory"
version = "0.1.0"
description = "Filesystem-backed video buffer with scheduled TikTok production"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "slaid098" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "prefect>=3.6,<3.7",
  # Prefect 3.6 импортирует backport на Python 3.12, но не объявляет его
  # в своих зависимостях; без пакета воркер падает при старте.
  "importlib-metadata>=4.4",
  "httpx>=0.27",
  "pillow>=11",
  "vastai==0.2.8",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "apscheduler>=3.11,<4",
  "loguru>=0.7.2",
  "imageio-ffmpeg>=0.5",
  "tenacity>=9.0",
  "yt-dlp[default,curl-cffi]>=2024.12.13",
  "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/content_factory"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src", "main.py"]
strict = true
warn_return_any = true
warn_unused_configs = true
pretty = true

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ruamel.yaml", "ruamel.yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not live and not e2e' --cov=content_factory --cov-report=term-missing --cov-fail-under=90"
markers = [
  "live: tests against real external services (excluded by default)",
  "e2e: end-to-end tests (excluded by default)",
]

[tool.coverage.run]
branch = true
source = ["src/content_factory"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.\\s*$",
]

[tool.audit]
# README этого репозитория — служебный runbook сервиса, а не продуктовая
# витрина. Delimiter-теги (summary/tagline/features) и cover из assets/
# осознанно не применяются: репозиторий не публикует продукт.
[[tool.audit.ignore]]
check_id = "readme_ceremony"
path = "README.md"
reason = "служебный runbook, не продуктовая витрина"

# ConfigError наследует ContentFactoryError — осознанная иерархия ошибок
# сервиса, чтобы вызывающий код мог ловить общий тип. DatabaseError — база
# порта БД: IntegrityError и OperationalError уточняют её, а не доменную
# иерархию, поэтому сервис не смешивает отказ базы с ошибкой конфигурации.
inheritance_allowlist = [
  "content_factory.exceptions.errors.ContentFactoryError",
  "content_factory.exceptions.errors.SupplierError",
  "content_factory.exceptions.errors.DeliveryError",
  "content_factory.exceptions.errors.DatabaseError",
]

# Конструкторы этапов (download/filter/mcp_session) совпадают по форме: два
# поля и их присваивание. Общий базовый класс ради четырёх строк добавил бы
# наследование в доменное ядро без выгоды; этапы компонуются оркестратором.
[[tool.audit.ignore]]
check_id = "duplicate_code"
path = "src/content_factory/services/supplier/downloader.py"
reason = "совпадение тривиальных конструкторов этапов, база была бы оверинжинирингом"

[[tool.audit.ignore]]
check_id = "duplicate_code"
path = "src/content_factory/services/generator/texts.py"
reason = "конструктор TextClient совпадает по форме с этапом supplier/finder: три присваивания полей, общий базовый класс не оправдан"

# commit/rollback/close у SQLite и PostgreSQL совпадают по форме: это три
# тонкие обёртки над драйвером. Отличается только тип переводимого
# исключения, поэтому общий базовый класс связал бы два адаптера ради трёх
# методов и усложнил бы перевод ошибок.
[[tool.audit.ignore]]
check_id = "duplicate_code"
path = "src/content_factory/db/connection.py"
reason = "обёртки commit/rollback/close отличаются только типом исключения драйвера; общая база не оправдана"

# Проверка ищет только legacy-имя docker-compose.yml. Канонический файл
# называется compose.yaml (требование issue #6 и современное имя Compose),
# поэтому находка «нет docker-compose.yml в корне» — ложное срабатывание.
[[tool.audit.ignore]]
check_id = "docker_layout"
path = "docker-compose.yml"
reason = "канонический compose-файл называется compose.yaml; проверка ждёт legacy-имя"

# orm_in_core запрещает db-импорты в ядре капсулы, ожидая ORM-модели.
# Перечисленные модули — инфраструктурные адаптеры: repository.py открывает
# SQLite через единую фабрику db.connection, остальные берут межпроцессную
# файловую блокировку db.lock. ORM-моделей и обхода слоя здесь нет.
[[tool.audit.ignore]]
check_id = "orm_in_core"
path = "src/content_factory/services/supplier/repository.py"
reason = "SQLite-адаптер капсулы: db.connection.connect — единая фабрика, не ORM"

[[tool.audit.ignore]]
check_id = "orm_in_core"
path = "src/content_factory/services/delivery/jobs.py"
reason = "single-build slot через db.lock (fcntl); ORM-моделей в капсуле нет"

[[tool.audit.ignore]]
check_id = "orm_in_core"
path = "src/content_factory/services/delivery/queries.py"
reason = "атомарная запись файла запросов под db.lock (fcntl), не ORM"

[[tool.audit.ignore]]
check_id = "orm_in_core"
path = "src/content_factory/services/supplier/downloader.py"
reason = "финализация скачивания под db.lock (fcntl), не ORM"

# migrate.py — самостоятельный CLI разового переноса плоского стока. Его
# запускают руками (`python -m ...`), оркестратор капсулы его не вызывает,
# поэтому недостижимость из service.py ожидаема.
[[tool.audit.ignore]]
check_id = "capsule_part_reachable"
path = "src/content_factory/services/stock/migrate.py"
reason = "отдельный CLI-вход миграции, не часть графа оркестратора stock"

# Миграции подключаются строкой из MIGRATION_MODULES в
# db/migrations/__init__.py: прямой импорт модуля не нужен, поэтому
# проверка «модуль никем не импортируется» здесь — ложное срабатывание.
[[tool.audit.ignore]]
check_id = "dead_module"
path = "src/content_factory/db/migrations/0005_generator_servers.py"
reason = "миграция подключается по строке из MIGRATION_MODULES, прямой импорт не требуется"

# _production_sessions — композиционный адаптер аренды: он единственный
# знает путь к БД и передаёт ServerJournal в VastSession. ORM-моделей здесь
# нет: db.server_journal — писатель журнала через порт соединения.
[[tool.audit.ignore]]
check_id = "orm_in_core"
path = "src/content_factory/services/generator/session_factory.py"
reason = "фабрика-адаптер аренды: db.server_journal — писатель журнала, ORM-моделей нет"

# index.py — адаптер синхронизации индекса стока: он открывает SQLite через
# единую фабрику db.connection и пишет таблицу stock_items. ORM-моделей в
# капсуле нет, поэтому протечка базы в ядро здесь ожидаема; сервисный
# entry service.py остаётся учётной логикой без записи в базу.
[[tool.audit.ignore]]
check_id = "orm_in_core"
path = "src/content_factory/services/stock/index.py"
reason = "синхронизация индекса stock_items через db.connection, ORM-моделей нет"

# Имя модуля миграции начинается с цифры, поэтому статический импорт
# невозможен: раннер подключает его строкой из MIGRATION_MODULES и вызывает
# apply(). Это реестр миграций, а не мёртвый модуль.
[[tool.audit.ignore]]
check_id = "dead_module"
path = "src/content_factory/db/migrations/0001_initial.py"
reason = "миграция подключается по строковому имени из реестра: имя начинается с цифры"

# CheckRegistry живёт рядом с QA Registry того же домена проверок.
[[tool.audit.ignore]]
check_id = "one_public_class_per_file"
path = "src/content_factory/services/production/qa.py"
reason = "issue #119: CheckRegistry — второй реестр того же домена проверок"

[[tool.audit.ignore]]
check_id = "dead_module"
path = "src/content_factory/db/migrations/0002_sources.py"
reason = "миграция подключается по строковому имени из реестра: имя начинается с цифры"

[[tool.audit.ignore]]
check_id = "dead_module"
path = "src/content_factory/db/migrations/0003_photo_refill.py"
reason = "миграция подключается по строковому имени из реестра: имя начинается с цифры"

[[tool.audit.ignore]]
check_id = "dead_module"
path = "src/content_factory/db/migrations/0004_trusted_devices.py"
reason = "миграция подключается по строковому имени из реестра: имя начинается с цифры"

# Контракт issue #145 фиксирует четыре типа доступа в одном модуле
# schemas/device_trust/models.py. Это неизменяемые DTO без логики; разносить
# их по файлам ради формы проверки значило бы разойтись с контрактом.
[[tool.audit.ignore]]
check_id = "one_public_class_per_file"
path = "src/content_factory/schemas/device_trust/models.py"
reason = "issue #145 фиксирует DeviceStatus и три DTO в одном модуле"

# Очередь уникализатора — инфраструктурный адаптер: connect(), репозиторий
# источников и обработка DatabaseError. ORM-моделей и обхода слоя здесь нет;
# сервисного entry service.py у капсулы нет, вход — CLI main.py.
[[tool.audit.ignore]]
check_id = "orm_in_core"
path = "src/content_factory/services/uniqueizer/importer.py"
reason = "импортёр источников: db.connection.connect и db.sources, ORM-моделей нет"

[[tool.audit.ignore]]
check_id = "orm_in_core"
path = "src/content_factory/services/uniqueizer/queue.py"
reason = "очередь копий: db.connection.connect и db.sources, ORM-моделей нет"

[[tool.audit.ignore]]
check_id = "orm_in_core"
path = "src/content_factory/services/uniqueizer/main.py"
reason = "CLI импортёра: db.errors для обработки отказа базы, ORM-моделей нет"


# Фильтр access-log uvicorn обязан быть stdlib logging.Filter: он правит
# args записи uvicorn.access до форматирования. Loguru перехватывает записи
# stdlib через свой sink, но фильтр на stdlib-логгере остаётся единственным
# способом убрать токен из уже сформированного access-лога uvicorn.
[[tool.audit.ignore]]
check_id = "logging_style"
path = "src/content_factory/config/access_log.py"
reason = "фильтр uvicorn.access — stdlib logging.Filter, loguru запись не перехватывает"

[[tool.audit.ignore]]
check_id = "inheritance_whitelist"
path = "src/content_factory/config/access_log.py"
reason = "logging.Filter — контракт stdlib для фильтра access-log uvicorn"

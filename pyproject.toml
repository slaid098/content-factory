[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-factory"
version = "0.1.0"
description = "Filesystem-backed video buffer with scheduled TikTok production"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "slaid098" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "prefect>=3.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "loguru>=0.7.2",
  "yt-dlp[default,curl-cffi]>=2024.12.13",
  "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/content_factory"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src", "main.py"]
strict = true
warn_return_any = true
warn_unused_configs = true
pretty = true

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not live and not e2e' --cov=content_factory --cov-report=term-missing --cov-fail-under=90"
markers = [
  "live: tests against real external services (excluded by default)",
  "e2e: end-to-end tests (excluded by default)",
]

[tool.coverage.run]
branch = true
source = ["src/content_factory"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.\\s*$",
]

[tool.audit]
# README этого репозитория — служебный runbook сервиса, а не продуктовая
# витрина. Delimiter-теги (summary/tagline/features) и cover из assets/
# осознанно не применяются: репозиторий не публикует продукт.
[[tool.audit.ignore]]
check_id = "readme_ceremony"
path = "README.md"
reason = "служебный runbook, не продуктовая витрина"

# ConfigError наследует ContentFactoryError — осознанная иерархия ошибок
# сервиса, чтобы вызывающий код мог ловить общий тип.
inheritance_allowlist = [
  "content_factory.exceptions.errors.ContentFactoryError",
  "content_factory.exceptions.errors.SupplierError",
]

# Конструкторы этапов (download/filter/mcp_session) совпадают по форме: два
# поля и их присваивание. Общий базовый класс ради четырёх строк добавил бы
# наследование в доменное ядро без выгоды; этапы компонуются оркестратором.
[[tool.audit.ignore]]
check_id = "duplicate_code"
path = "src/content_factory/services/supplier/downloader.py"
reason = "совпадение тривиальных конструкторов этапов, база была бы оверинжинирингом"

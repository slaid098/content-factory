name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: content_factory
          POSTGRES_PASSWORD: content_factory
          POSTGRES_DB: content_factory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U content_factory -d content_factory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONTENT_FACTORY_TEST_DATABASE_URL: >-
        postgresql://content_factory:content_factory@localhost:5432/content_factory_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install UI
        working-directory: frontend
        run: npm ci

      - name: Lint UI
        working-directory: frontend
        run: npm run lint

      - name: Types UI
        working-directory: frontend
        run: npm run typecheck

      - name: Tests UI
        working-directory: frontend
        run: npm run test

      - name: Build UI
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy src main.py

      - name: Tests
        run: python -m pytest

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E
        working-directory: frontend
        env:
          # E2E проверяет UI и старше device gate: у браузера Playwright нет
          # cookie устройства. Сам gate покрыт pytest-тестами.
          CONTENT_FACTORY_DEVICE_GATE_ENABLED: "false"
        run: npm run test:e2e

  # Единственный блокирующий аудит-шаг: `audit` остаётся WARN-only, а гейт
  # падает только на новых находках в файлах, изменённых против базового
  # коммита. Baseline собирается тем же тегом движка на merge-base с
  # origin/main, живёт в $RUNNER_TEMP и кэшируется по SHA базового коммита;
  # в репозиторий он не попадает. Для PR из форков job пропускается: GitHub
  # не отдаёт форкам секреты, а движок закрытый.
  audit-gate:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUDIT_ENGINE_REPO: https://git.slaid098.dev/slaid098/agent-skills
      AUDIT_ENGINE_VERSION: "0.6.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      # База гейта — merge-base с main, а не HEAD: для PR это базовый коммит
      # ветки, для push в main diff пустой и гейт зелёный.
      - name: Resolve base commit
        id: base
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          base=$(git merge-base HEAD origin/main)
          {
            echo "sha=$base"
            echo "cache-key=audit-baseline-v2-${RUNNER_OS}-py3.12-${AUDIT_ENGINE_VERSION}-${base}"
          } >> "$GITHUB_OUTPUT"
          echo "base: $base"

      - name: Restore baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/audit-baseline.json
          key: ${{ steps.base.outputs.cache-key }}

      # Токен нужен только закрытому движку; git config пишет его в
      # ~/.gitconfig эфемерного раннера, в лог значение не попадает.
      - name: Configure engine auth
        env:
          ENGINE_GIT_TOKEN: ${{ secrets.ENGINE_GIT_TOKEN }}
        run: |
          token=$(printf '%s' "${ENGINE_GIT_TOKEN}" | tr -d '[:space:]')
          if [ -z "${token}" ]; then
            echo "::error::Секрет ENGINE_GIT_TOKEN не задан."
            exit 1
          fi
          git config --global url."https://oauth2:${token}@git.slaid098.dev/".insteadOf "https://git.slaid098.dev/"

      - name: Build baseline
        if: steps.baseline.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          engine="git+${AUDIT_ENGINE_REPO}@v${AUDIT_ENGINE_VERSION}"
          base_tree="$RUNNER_TEMP/audit-base"
          git worktree add --detach "$base_tree" "$BASE_SHA"
          if ! uvx --python 3.12 --from "$engine" audit --repo "$base_tree" --json-report > "$RUNNER_TEMP/audit-baseline.json"; then
            echo "::error::Не удалось поставить движок ${AUDIT_ENGINE_VERSION} из ${AUDIT_ENGINE_REPO}; проверьте доступ на чтение."
            exit 1
          fi
          git worktree remove --force "$base_tree"

      # Baseline — schema 3; чужой отчёт не должен тихо пропустить находки.
      - name: Validate baseline
        run: |
          python3 - "$RUNNER_TEMP/audit-baseline.json" "$AUDIT_ENGINE_VERSION" <<'PY'
          import json
          import sys

          path, expected_engine = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              report = json.load(fh)
          schema = report.get("schema_version") if isinstance(report, dict) else None
          if schema != 3:
              raise SystemExit(f"baseline: schema_version {schema!r}, ожидался 3")
          engine = report.get("engine_version")
          if engine != expected_engine:
              raise SystemExit(
                  f"baseline: engine_version {engine!r}, ожидался {expected_engine!r}"
              )
          print(f"baseline: schema 3, engine {engine}, находок {len(report['findings'])}")
          PY

      - name: Save baseline
        if: steps.baseline.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/audit-baseline.json
          key: ${{ steps.base.outputs.cache-key }}

      - name: Gate new findings
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          engine="git+${AUDIT_ENGINE_REPO}@v${AUDIT_ENGINE_VERSION}"
          uvx --python 3.12 --from "$engine" audit-gate --repo . \
            --baseline "$RUNNER_TEMP/audit-baseline.json" \
            --base "$BASE_SHA" --scope changed

  # Сборка только для main: latest обязан указывать на образ из зелёного main.
  build-push:
    needs: ci
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: image
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: |
            ghcr.io/slaid098/content-factory:latest
            ghcr.io/slaid098/content-factory:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Деплой не отменяем: второй пуш в main дождётся завершения первого.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check deploy secrets
        run: |
          missing=()
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Не заданы секреты репозитория: ${missing[*]}. См. deploy/README.md."
            exit 1
          fi

      - name: Install SSH key
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 644 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy
        run: |
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/content-factory-deploy ${GITHUB_SHA}"

      # Ключ живёт только на эфемерном runner, но убрать его нужно и при ошибке.
      - name: Remove SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
